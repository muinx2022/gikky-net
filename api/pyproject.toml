[project]
name = "gikky-api"
version = "0.1.0"
description = "gikky.net — Django 5 + Ninja backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    # Tài khoản (Phase 2). `[socialaccount]` kéo theo `requests`/`python3-openid` cho
    # provider Google — provider chỉ được ĐĂNG KÝ khi có `GOOGLE_CLIENT_ID` trong env
    # (xem `config/settings.py`), nhưng gói thì phải có sẵn để `INSTALLED_APPS` nạp được
    # `allauth.socialaccount` một cách vô điều kiện.
    "django-allauth[socialaccount]>=65.4",
    # Ảnh (Phase 5). Pillow là thứ NHẬN DẠNG ảnh bằng nội dung và TÁI MÃ HOÁ nó —
    # hai phép kiểm mà tên file và `Content-Type` do client gửi không thay được.
    # Xem `core/anh.py`.
    "Pillow>=11.0",
    # Sanitize HTML của `body` mốc (Tiptap, 2026-08-24). `nh3` là binding của **ammonia**
    # (Rust) — allowlist thẻ/thuộc tính/giao thức, dựng trên cùng parser html5ever mà
    # Firefox dùng. Không phải `bleach`: `bleach` đã ngừng phát triển, mà `pytest` ở repo
    # này chạy `filterwarnings = ["error"]`. Xem `core/lam_sach_html.py`.
    "nh3>=0.2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "core", "api"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"
# Luật 2 — 0 warning là MỐC: mọi warning thành lỗi. Không có dòng ignore nào.
filterwarnings = ["error"]
