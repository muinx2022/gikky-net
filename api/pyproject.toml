[project]
name = "gikky-api"
version = "0.1.0"
description = "gikky.net — Django 5 + Ninja backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "core", "api"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"
# Luật 2 — 0 warning là MỐC: mọi warning thành lỗi. Không có dòng ignore nào.
filterwarnings = ["error"]
